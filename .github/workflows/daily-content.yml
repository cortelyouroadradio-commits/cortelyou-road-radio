name: Daily content rebuild

# Triggers a Netlify rebuild every morning. Netlify regenerates content.json
# from live feeds during its own build (see netlify.toml), so this job never
# commits to the repo — your manual pushes to main can never collide with it.

on:
  schedule:
    - cron: "10 9 * * *"   # ~5:10 AM ET (cron is UTC). Adjust as you like.
  workflow_dispatch: {}    # lets you run it by hand from the Actions tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        run: curl -fsS -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
